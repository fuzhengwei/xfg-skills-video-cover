<!--
  单页视频封面 HTML 模板 v2.0
  使用方式：复制此模板，替换 {{占位符}} 内容
  支持 B站(16:9)、小红书(3:4)、微信视频号(9:16)
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} - 视频封面</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0a0a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  /* === 平台尺寸 === */
  .cover-bilibili { aspect-ratio: 16 / 9; max-width: 1200px; }
  .cover-xiaohongshu { aspect-ratio: 3 / 4; max-width: 900px; }
  .cover-wechat { aspect-ratio: 9 / 16; max-width: 1080px; }

  .cover-card {
    width: 94vw;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    background: {{BG_COLOR}};
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }

  .cv-bg-decoration { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .cv-bg-circle { position: absolute; border-radius: 50%; opacity: 0.06; }

  .cv-content {
    position: relative; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    width: 100%; height: 100%; padding: 40px;
  }

  .cv-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 18px; border-radius: 20px;
    font-size: 14px; font-weight: 700; letter-spacing: 1px; margin-bottom: 16px;
    background: rgba(255,255,255,0.1); color: {{ACCENT1}};
    border: 1px solid rgba(255,255,255,0.2);
  }

  .cv-main-title {
    font-size: {{TITLE_SIZE}}px; font-weight: 900; line-height: 1.08;
    letter-spacing: 2px; margin-bottom: 10px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.4); max-width: 90%;
  }
  .cv-main-title .highlight { display: inline-block; transform: rotate(-3deg); }

  .cv-sub-title {
    font-size: {{SUBTITLE_SIZE}}px; font-weight: 600;
    margin-bottom: 16px; letter-spacing: 1px; max-width: 85%;
  }

  .cv-tag-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
  .cv-tag {
    padding: 6px 18px; border-radius: 16px;
    font-size: 15px; font-weight: 700; letter-spacing: 0.5px;
    background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8);
  }

  .cv-emoji-deco {
    position: absolute; opacity: 0.10; z-index: 1; object-fit: contain;
  }

  .cv-bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 36px;
    background: rgba(0,0,0,0.35); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px; font-size: 13px; color: rgba(255,255,255,0.5); z-index: 4;
  }

  /* 小红书 竖版调整 */
  .cover-xiaohongshu .cv-content { padding: 36px 32px; }
  .cover-xiaohongshu .cv-main-title { line-height: 1.12; }

  /* 微信视频号 全竖屏调整 */
  .cover-wechat .cv-content { padding: 32px 28px; }
  .cover-wechat .cv-main-title { line-height: 1.15; }
  .cover-wechat .cv-badge { margin-bottom: 24px; }
</style>
</head>
<body>

<div class="cover-card {{PLATFORM_CLASS}}">
  <!-- 背景装饰 -->
  <div class="cv-bg-decoration">
    <div class="cv-bg-circle" style="width:380px;height:380px;background:{{ACCENT1}};top:-80px;left:-80px;"></div>
    <div class="cv-bg-circle" style="width:280px;background:{{ACCENT2}};bottom:-60px;right:-60px;"></div>
    <img class="cv-emoji-deco" src="{{EMOJI1_URL}}" alt="{{EMOJI1_CHAR}}"
         style="top:15%;left:6%;width:90px;height:90px;" onerror="this.style.display='none'">
    <img class="cv-emoji-deco" src="{{EMOJI2_URL}}" alt="{{EMOJI2_CHAR}}"
         style="bottom:12%;right:8%;width:66px;height:66px;" onerror="this.style.display='none'">
  </div>

  <!-- 主内容 -->
  <div class="cv-content">
    <div class="cv-badge">{{EMOJI1_CHAR}} {{BADGE}}</div>
    <div class="cv-main-title">{{TITLE_WITH_HIGHLIGHT}}</div>
    <div class="cv-sub-title">{{SUBTITLE}}</div>
    <div class="cv-tag-row">{{TAGS_HTML}}</div>
  </div>

  <!-- 底部栏 -->
  <div class="cv-bottom-bar">
    <span>{{EMOJI2_CHAR}} {{QUOTE}}</span>
    <span>{{PLATFORM_NAME}}</span>
  </div>
</div>

</body>
</html>
